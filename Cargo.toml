[package]
name = "t-o"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web-static-files = "4.0.1"
actix-web = "4"
anyhow = "1.0"
opentelemetry = "0.31"
opentelemetry-instrumentation-actix-web = "0.23"
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic"] }
opentelemetry-stdout = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
rand = "0.8.5"
tokio = "1.48"
tracing = "0.1"
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "registry", "std", "fmt"] }

static-files = "0.2.3"

[build-dependencies]
static-files = "0.2.3"
